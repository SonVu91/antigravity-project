name: Build Cardano Hot Wallet APKs (v2.0.5)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build Native Core, Run Tests & Package Hot Wallet APKs (32-bit & 64-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK Environment
        run: |
          NDK_DIR=$(ls -1d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Build Host Rust Cardano Core for Linux tests
        run: |
          TARGET_DIR="2. Tạo ví Cardano v2.0"
          cd "$TARGET_DIR/rust_cardano_core"
          cargo build --release
          cp target/release/librust_cardano_core.so ../cardano_airgap_bridge/ || true
          sudo cp target/release/librust_cardano_core.so /usr/local/lib/ || true
          sudo ldconfig || true
          cd ../..

      - name: Build Rust Cardano Core for Android (arm64, armv7 32-bit, x86_64)
        run: |
          TARGET_DIR="2. Tạo ví Cardano v2.0"
          cd "$TARGET_DIR/rust_cardano_core"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../mobile_online/android/app/src/main/jniLibs build --release
          cd ../..

      - name: Run Bridge Package Tests
        run: |
          TARGET_DIR="2. Tạo ví Cardano v2.0"
          cd "$TARGET_DIR/cardano_airgap_bridge"
          flutter pub get
          flutter test --coverage

      - name: Run Mobile Online (Hot) Wallet Tests
        run: |
          TARGET_DIR="2. Tạo ví Cardano v2.0"
          cd "$TARGET_DIR/mobile_online"
          flutter pub get
          flutter test --coverage

      - name: Build Mobile Online (Hot) Wallet APK (Split Per ABI & Universal)
        run: |
          TARGET_DIR="2. Tạo ví Cardano v2.0"
          cd "$TARGET_DIR/mobile_online"
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build web --release --base-href "/antigravity-project/"

      - name: Package & Organize APK and Web Artifacts
        run: |
          mkdir -p release-apks
          TARGET_DIR="2. Tạo ví Cardano v2.0"

          HOT_DIR="$TARGET_DIR/mobile_online/build/app/outputs/flutter-apk"

          # Hot Wallet APKs (Online Watch-Only Hub)
          cp "$HOT_DIR/app-armeabi-v7a-release.apk" release-apks/cardano-hot-wallet-v2.0.5-armv7.apk || true
          cp "$HOT_DIR/app-arm64-v8a-release.apk" release-apks/cardano-hot-wallet-v2.0.5-arm64.apk || true
          cp "$HOT_DIR/app-release.apk" release-apks/cardano-hot-wallet-v2.0.5-universal.apk || true

          # Web Bundle
          (cd "$TARGET_DIR/mobile_online/build/web" && zip -r "../../../../release-apks/cardano-hot-wallet-web-v2.0.5.zip" .) || true

          # Generate SHA256 checksums
          cd release-apks
          sha256sum *.apk > SHA256SUMS-v2.0.5.txt
          cat SHA256SUMS-v2.0.5.txt
          cd ..

      - name: Upload Hot Wallet APKs (32-bit & 64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: cardano-hot-wallet-v2.0.5-apks
          path: release-apks/cardano-hot-wallet-v2.0.5*.apk

      - name: Upload All Release Bundles
        uses: actions/upload-artifact@v4
        with:
          name: cardano-hot-wallet-v2.0.5-all-bundles
          path: release-apks/*

      - name: Publish GitHub Release v2.0.5
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0.5
          name: "Cardano Hot Wallet & Watch-Only Hub v2.0.5 (Web PWA & Android APK)"
          body: |
            ### Cardano Hot Wallet Release v2.0.5
            Phiên bản phát hành chính thức **Cardano Hot Wallet & Watch-Only Hub** cho Web PWA và các thiết bị Android (32-bit ARMv7 & 64-bit ARM64).

            #### Tính năng cốt lõi:
            - **Web PWA trên GitHub Pages**: Chạy trực tiếp trên trình duyệt mọi thiết bị tại https://sonvu91.github.io/antigravity-project/.
            - **Trình theo dõi ví đa tài khoản**: Quản lý nhiều tài khoản ví Cardano, tự động truy vấn số dư ADA, tài sản Native Tokens, Stake Pool từ Blockfrost API.
            - **Xây dựng giao dịch Conway CIP-1694**: Hỗ trợ tạo giao dịch Cardano chuẩn xác, tính toán phí và UTxO tự động.
            - **Hỗ trợ đa mạng linh hoạt**: Chuyển đổi mượt mà giữa Mainnet, Preprod, và Preview.
            - **Đính kèm file cài đặt**:
              - `cardano-hot-wallet-v2.0.5-armv7.apk`: Cho Android 32-bit (Samsung Galaxy J7...).
              - `cardano-hot-wallet-v2.0.5-arm64.apk`: Cho Android 64-bit hiện đại.
              - `cardano-hot-wallet-v2.0.5-universal.apk`: Bản cài đặt tương thích mọi dòng máy Android.
              - `cardano-hot-wallet-web-v2.0.5.zip`: Gói Web PWA đóng gói sẵn.
              - `SHA256SUMS-v2.0.5.txt`: Bảng mã băm xác minh tính toàn vẹn.
          files: release-apks/*
